<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국사 퀴즈 - 3분 타임어택 (150제)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Noto Sans KR', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
            color: #ffffff;
        }

        .main-wrapper {
            display: flex;
            gap: 25px;
            width: 100%;
            max-width: 1050px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            flex: 1 1 550px;
            max-width: 620px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .mini-leaderboard {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 25px;
            flex: 1 1 280px;
            max-width: 340px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            height: fit-content;
        }

        .leaderboard-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
        }

        .leaderboard-item.current-player {
            background: rgba(0, 242, 254, 0.15);
            border-color: #00f2fe;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
            font-weight: 700;
        }

        .rank-badge {
            font-weight: 700;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
        }

        .rank-1 .rank-badge { background: #ffd700; color: #15102a; }
        .rank-2 .rank-badge { background: #c0c0c0; color: #15102a; }
        .rank-3 .rank-badge { background: #cd7f32; color: #15102a; }

        .player-name { flex-grow: 1; margin-left: 12px; }
        .player-score { font-weight: 700; color: #00f2fe; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .stats { font-size: 0.95rem; font-weight: bold; color: #ff007f; text-align: right; line-height: 1.4; }

        .question-box {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 30px;
            text-align: center;
            min-height: 80px;
            animation: fadeIn 0.6s ease-out;
        }

        .choices-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }

        .choice-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #eeeeee;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s ease;
        }

        .choice-btn:hover {
            background: rgba(0, 242, 254, 0.1);
            border-color: #00f2fe;
            color: #00f2fe;
            transform: translateY(-2px);
        }

        .input-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }

        .answer-input {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px;
            font-size: 1.1rem;
            border-radius: 14px;
            color: #fff;
            outline: none;
            text-align: center;
            transition: all 0.3s ease;
        }

        .answer-input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .submit-btn {
            background: #00f2fe;
            color: #15102a;
            border: none;
            padding: 15px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover { background: #00b09b; color: #fff; }
        .choice-btn.correct { background: linear-gradient(90deg, #00b09b, #96c93d) !important; color: #fff !important; }
        .choice-btn.wrong { background: linear-gradient(90deg, #ff416c, #ff4b2b) !important; color: #fff !important; }

        .feedback-box {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            text-align: center;
            margin-bottom: 25px;
            display: none;
            white-space: pre-line;
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            display: none;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.1) 0%, rgba(79, 172, 254, 0.1) 100%);
            z-index: 1;
            filter: blur(1px);
        }
        .circle1 { width: 300px; height: 300px; top: -10%; left: -10%; }
        .circle2 { width: 400px; height: 400px; bottom: -15%; right: -10%; background: linear-gradient(135deg, rgba(255, 0, 127, 0.08) 0%, rgba(255, 75, 43, 0.08) 100%); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

    <div class="main-wrapper">
        <div class="game-container">
            <div class="header">
                <div class="title" id="quiz-title">⏱️ 2학기 사회 한국사 3분 어택</div>
                <div class="stats" id="score-board">TIME: 3:00<br>SCORE: 000 | COMBO: 0</div>
            </div>
            <div class="question-box" id="question">이름 등록 단계</div>
            <div id="interaction-box"></div>
            <div class="feedback-box" id="feedback"></div>
            <button class="action-btn" id="action-btn" onclick="handleActionClick()">다음 문제로 전진 ➡️</button>
        </div>

        <div class="mini-leaderboard">
            <div class="leaderboard-title">🏆 실시간 랭킹 Top 5</div>
            <div class="leaderboard-list" id="leaderboard-list">
                <div style="text-align:center; color:#888; padding:15px;">등록된 랭킹이 없습니다.</div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyRpKFGEIGhD-g0rc5wyxFe_ufdvfLW9zDPYG-PAAFX31Wdl5PKR8PFMNw5TaCslioY/exec';

        const quizList = [
            // ==================== 주관식 50문항 ====================
            {"type": "short", "q": "Q. 조선 후기 백성들의 세금 부담을 줄이기 위해 군포를 1년에 2필에서 1필로 줄여준 영조의 제도는?", "a": "균역법", "e": "🎯 균역법을 통해 농민들의 군포 부담을 절반으로 줄여주었어."},
            {"type": "short", "q": "Q. 조선 후기 붕당 간의 갈등을 없애고 인재를 골고루 등용하기 위해 영조와 정조가 추진한 정책은?", "a": "탕평책", "e": "🎯 탕평책은 특정 붕당에 치우치지 않고 고르게 등용하는 정책이야."},
            {"type": "short", "q": "Q. 정조가 왕권을 강화하고 젊은 학자들을 육성하기 위해 궁궐 안에 설치한 학문 연구 기관은?", "a": "규장각", "e": "🎯 규장각은 정조의 정책 연구와 개혁의 중심 기관이었어."},
            {"type": "short", "q": "Q. 정조의 친위 부대로, 왕권을 뒷받침하고 도성과 화성을 지키던 군사 조직은?", "a": "장용영", "e": "🎯 장용영은 왕권을 강력하게 호위하는 정예 국왕 친위 부대야."},
            {"type": "short", "q": "Q. 정약용이 수원 화성을 축조할 때 무거운 돌을 적은 힘으로 들어 올리기 위해 발명한 기구는?", "a": "거중기", "e": "🎯 도르래의 원리를 이용한 거중기는 공사 기간을 크게 단축시켰어."},
            {"type": "short", "q": "Q. 조선 후기 정약용이 지방 관리들이 지켜야 할 도리와 행정 지침을 기록한 대표적인 저서는?", "a": "목민심서", "e": "🎯 목민심서는 수령(목민관)의 올바른 마음가짐과 백성을 돌보는 법을 적은 책이야."},
            {"type": "short", "q": "Q. 김정호가 조선 전국의 지형과 도로망을 직접 정밀하게 목판으로 인쇄하여 만든 대형 지도는?", "a": "대동여지도", "e": "🎯 대동여지도는 22첩의 접이식으로 휴대와 열람이 매우 편리했어."},
            {"type": "short", "q": "Q. 조선 후기 양반과 신분제의 위선을 비판한 '양반전', '허생전' 등을 쓴 실학자는 누구일까요?", "a": "박지원", "e": "🎯 박지원은 상공업 발전을 주장하며 한문 소설을 통해 양반 사회를 날카롭게 비판했어."},
            {"type": "short", "q": "Q. 19세기 세도 정치 시기 서민들을 고통스럽게 만든 전정, 군정, 환곡을 통틀어 부르는 말은?", "a": "삼정의 문란", "e": "🎯 삼정의 문란으로 백성들의 삶이 극도로 피폐해지고 농민 봉기가 일어났어."},
            {"type": "short", "q": "Q. 1860년 최제우가 서학(천주교)에 맞서 '모든 인간은 하늘처럼 평등하다(인내천)'는 사상으로 창시한 종교는?", "a": "동학", "e": "🎯 동학은 신분제 차별 없이 사람이 곧 하늘이라는 인내천 사상을 강조했어."},
            {"type": "short", "q": "Q. 어린 고종을 대신하여 권력을 잡고 왕권 강화와 서원 철폐, 경복궁 중건을 추진한 인물은?", "a": "흥선대원군", "e": "🎯 흥선대원군은 세도 정치를 몰아내고 파격적인 개혁 정책을 펼쳤어."},
            {"type": "short", "q": "Q. 흥선대원군이 양반들에게도 군포(세금)를 징수하기 위해 실시한 획기적인 세금 개혁 제도는?", "a": "호포제", "e": "🎯 호포제는 집집마다 신분에 관계없이 군포를 부과하는 제도였어."},
            {"type": "short", "q": "Q. 흥선대원군이 경복궁을 중건하기 위해 발행하였으나 극심한 물가 상승을 일으킨 고액 화폐는?", "a": "당백전", "e": "🎯 당백전은 상평통보의 100배 가치를 지녀 경제적 혼란과 인플레이션을 초래했어."},
            {"type": "short", "q": "Q. 1866년 프랑스군이 병인박해를 구실로 강화도를 침략하여 외규장각 도서 등을 약탈한 사건은?", "a": "병인양요", "e": "🎯 양헌수 장군 등이 정족산성에서 프랑스군을 격퇴했어."},
            {"type": "short", "q": "Q. 1871년 미국 군함이 제너럴 셔먼호 사건을 구실로 강화도를 침공한 사건은?", "a": "신미양요", "e": "🎯 어재연 장군과 조선 수비군이 광성보에서 끝까지 결사항전했어."},
            {"type": "short", "q": "Q. 서양 세력의 침략을 물리친 후 외세와의 화친을 거부한다는 결의를 전국 각지에 세워 알린 비석은?", "a": "척화비", "e": "🎯 흥선대원군은 전국 각지에 척화비를 세워 쇄국 및 통상 수교 거부 의지를 확고히 했어."},
            {"type": "short", "q": "Q. 1876년 조선이 일본의 운요호 사건 이후 체결한 최초의 근대적이자 불평등 조약은?", "a": "강화도 조약", "e": "🎯 강화도 조약(조일수호조규)으로 부산, 원산, 인천 3개 항구가 개항되었어."},
            {"type": "short", "q": "Q. 1882년 구식 군인들이 신식 군대(별기군)에 대한 차별 대우와 썩은 쌀 지급에 분노하여 일으킨 반란은?", "a": "임오군란", "e": "🎯 임오군란 이후 청나라의 내정 간섭이 본격적으로 심해졌어."},
            {"type": "short", "q": "Q. 1884년 김옥균, 박영효 등 급진 개화파가 우정총국 개국 축하연을 기회로 일으킨 정변은?", "a": "갑신정변", "e": "🎯 근대적 내각을 수립하려 했으나 청나라의 개입으로 3일 만에 실패했어(3일 천하)."},
            {"type": "short", "q": "Q. 1894년 전봉준을 중심으로 보국안민과 제폭구민을 외치며 일어난 대규모 농민 운동은?", "a": "동학 농민 운동", "e": "🎯 동학 농민군은 전주성을 점령하고 집강소를 설치하여 자치적 개혁을 추진했어."},
            {"type": "short", "q": "Q. 1894년 김홍집 내각이 추진한 신분제(노비제) 폐지, 과거제 폐지 등 근대적 국가 개혁은?", "a": "갑오개혁", "e": "🎯 갑오개혁은 한국사 최초로 법적 신분제를 완전 철폐한 일대 전환점이야."},
            {"type": "short", "q": "Q. 1895년 일본 낭인들이 경복궁을 침범하여 명성황후를 잔인하게 시해한 참극은?", "a": "을미사변", "e": "🎯 을미사변과 단발령 공포는 전국적인 을미의병 봉기의 결정적 도화선이 되었어."},
            {"type": "short", "q": "Q. 1897년 고종이 환궁 후 황제 즉위식을 올리며 선포한 자주 독립 국가의 공식 국호는?", "a": "대한제국", "e": "🎯 고종은 광무개혁을 통해 근대적 자주 국가임을 대내외에 널리 천명했어."},
            {"type": "short", "q": "Q. 서재필 등이 창립하여 만민공동회를 열고 자주독립과 자유민권 운동을 펼친 단체는?", "a": "독립협회", "e": "🎯 독립협회는 서재필, 윤치호 등이 중심이 되어 독립문과 독립관을 건립했어."},
            {"type": "short", "q": "Q. 1905년 일제가 대한제국의 외교권을 강제로 빼앗고 통감부를 설치한 늑약은?", "a": "을사늑약", "e": "🎯 고종의 비준 없이 강압적으로 체결된 원천 무효의 불평등 조약이야."},

        let currentIdx = 0;

        let isAnswered = false;
        let playerName = "플레이어";
        let leaderboardData = [];
        
        let timeLeft = 180;
        let timerInterval = null;
        let isGameActive = false;

        const qEl = document.getElementById('question');
        const intBox = document.getElementById('interaction-box');
        const fBox = document.getElementById('feedback');
        const actBtn = document.getElementById('action-btn');
        const scoreEl = document.getElementById('score-board');
        const rankListEl = document.getElementById('leaderboard-list');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function loadLeaderboard() {
            if (!SCRIPT_URL || SCRIPT_URL.includes('여기에_구글_웹앱')) return;
            fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                leaderboardData = data;
                renderLeaderboard();
            })
            .catch(err => console.error("랭킹 로드 실패:", err));
        }

        function renderLeaderboard() {
            if (!leaderboardData || leaderboardData.length === 0) return;
            rankListEl.innerHTML = '';
            leaderboardData.sort((a, b) => b.score - a.score);

            leaderboardData.slice(0, 5).forEach((player, idx) => {
                const item = document.createElement('div');
                item.classList.add('leaderboard-item', `rank-${idx + 1}`);
                if (player.name === playerName) item.classList.add('current-player');

                item.innerHTML = `
                    <div class="rank-badge">${idx + 1}</div>
                    <div class="player-name">${player.name}</div>
                    <div class="player-score">${player.score}점</div>
                `;
                rankListEl.appendChild(item);
            });
        }

        function updateLiveScore(isFinal = false) {
            if (!SCRIPT_URL || SCRIPT_URL.includes('여기에_구글_웹앱')) return;
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ name: playerName, score: score })
            })
            .then(() => {
                loadLeaderboard();
                if (isFinal) {
                    setTimeout(showFinalResult, 500);
                }
            })
            .catch(err => console.error("점수 전송 실패:", err));
        }

        function askPlayerName() {
            isAnswered = false;
            isGameActive = false;
            clearInterval(timerInterval);
            timeLeft = 180;
            fBox.style.display = 'none';
            actBtn.style.display = 'none';
            intBox.innerHTML = '';
            
            qEl.innerText = "챌린지에 참여할 이름을 등록해 주세요!";

            const inputContainer = document.createElement('div');
            inputContainer.classList.add('input-container');

            const input = document.createElement('input');
            input.type = "text";
            input.classList.add('answer-input');
            input.placeholder = "닉네임을 입력하세요 (최대 6자)";
            input.id = "name-input";
            input.maxLength = 6;
            input.onkeypress = (e) => { if(e.key === 'Enter') startGameWithPlayer(); };

            const submitBtn = document.createElement('button');
            submitBtn.classList.add('submit-btn');
            submitBtn.innerText = "등록하고 시작하기 🚀";
            submitBtn.onclick = startGameWithPlayer;

            inputContainer.appendChild(input);
            inputContainer.appendChild(submitBtn);
            intBox.appendChild(inputContainer);
            input.focus();
            updateScoreBoard();
        }

        function startGameWithPlayer() {
            const nameInput = document.getElementById('name-input');
            const val = nameInput.value.trim();
            if(!val) return;

            playerName = val;
            initGame();
        }

        function initGame() {
            currentIdx = 0;
            score = 0;
            combo = 0;
            timeLeft = 180;
            isGameActive = true;
            shuffleArray(quizList); 
            updateScoreBoard();
            updateLiveScore();
            
            timerInterval = setInterval(updateTimer, 1000);
            loadQuiz();
        }

        function updateTimer() {
            if (!isGameActive) return;
            timeLeft--;
            updateScoreBoard();

            if (timeLeft <= 0) {
                endGame();
            }
        }

        function loadQuiz() {
            if (!isGameActive) return;
            isAnswered = false;
            fBox.style.display = 'none';
            actBtn.style.display = 'none';
            intBox.innerHTML = '';

            if (currentIdx >= quizList.length) {
                currentIdx = 0;
                shuffleArray(quizList);
            }

            const currentQuiz = quizList[currentIdx];
            qEl.innerText = `${currentIdx + 1}. ${currentQuiz.q.replace('Q. ', '')}`;

            if (currentQuiz.type === "choice") {
                const choicesContainer = document.createElement('div');
                choicesContainer.classList.add('choices-container');
                currentQuiz.c.forEach((choice, index) => {
                    const button = document.createElement('button');
                    button.classList.add('choice-btn');
                    button.innerText = choice;
                    button.onclick = () => checkChoiceAnswer(index, button);
                    choicesContainer.appendChild(button);
                });
                intBox.appendChild(choicesContainer);
                document.activeElement.blur();
            } else if (currentQuiz.type === "short") {
                const inputContainer = document.createElement('div');
                inputContainer.classList.add('input-container');

                const input = document.createElement('input');
                input.type = "text";
                input.classList.add('answer-input');
                input.placeholder = "정답을 입력하세요 (띄어쓰기 없이)";
                input.id = "user-input";
                input.onkeypress = (e) => { if(e.key === 'Enter' && !isAnswered) checkShortAnswer(); };

                const submitBtn = document.createElement('button');
                submitBtn.classList.add('submit-btn');
                submitBtn.innerText = "정답 검사하기 ✔️";
                submitBtn.onclick = checkShortAnswer;

                inputContainer.appendChild(input);
                inputContainer.appendChild(submitBtn);
                intBox.appendChild(inputContainer);
                input.focus();
            }
        }

        function checkChoiceAnswer(selectedIdx, clickedBtn) {
            if(isAnswered || !isGameActive) return;
            isAnswered = true;
            const currentQuiz = quizList[currentIdx];
            const allButtons = intBox.querySelectorAll('.choice-btn');

            if(selectedIdx === currentQuiz.a) {
                combo++;
                score += 100 + (combo * 10);
                clickedBtn.classList.add('correct');
                showFeedback(true, currentQuiz.e);
            } else {
                combo = 0;
                clickedBtn.classList.add('wrong');
                allButtons[currentQuiz.a].classList.add('correct');
                showFeedback(false, currentQuiz.e);
            }
            updateLiveScore();
            showNextControls();
        }

        function checkShortAnswer() {
            if(isAnswered || !isGameActive) return;
            const inputEl = document.getElementById('user-input');
            const userAnswer = inputEl.value.trim().replace(/\s+/g, '');
            if(!userAnswer) return;

            isAnswered = true;
            inputEl.disabled = true;
            intBox.querySelector('.submit-btn').style.display = 'none';
            const currentQuiz = quizList[currentIdx];
            const cleanAnswer = currentQuiz.a.replace(/\s+/g, '');

            if(userAnswer === cleanAnswer) {
                combo++;
                score += 100 + (combo * 10);
                inputEl.style.background = 'rgba(0, 176, 155, 0.2)';
                inputEl.style.borderColor = '#00b09b';
                showFeedback(true, currentQuiz.e);
            } else {
                combo = 0;
                inputEl.style.background = 'rgba(255, 65, 108, 0.2)';
                inputEl.style.borderColor = '#ff416c';
                showFeedback(false, `제출한 정답: ${inputEl.value}\n\n정답은 [ ${currentQuiz.a} ] 입니다!\n\n${currentQuiz.e}`);
            }
            updateLiveScore();
            showNextControls();
        }

        function showFeedback(isCorrect, text) {
            fBox.style.color = isCorrect ? '#00ff7f' : '#ff416c';
            fBox.innerText = isCorrect ? "⭕ 정답입니다!\n\n" + text : "❌ 오답입니다!\n\n" + text;
            fBox.style.display = 'block';
            updateScoreBoard();
        }

        function showNextControls() {
            actBtn.innerText = "다음 문제로 전진 ➡️";
            actBtn.style.display = 'block';
        }

        function handleActionClick() {
            if (isGameActive) {
                currentIdx++;
                loadQuiz();
            } else {
                askPlayerName();
            }
        }

        function updateScoreBoard() {
            const min = Math.floor(timeLeft / 60);
            const sec = String(timeLeft % 60).padStart(2, '0');
            scoreEl.innerHTML = `TIME: ${min}:${sec}<br>SCORE: ${String(score).padStart(3, '0')} | COMBO: ${combo}`;
        }

        function endGame() {
            isGameActive = false;
            clearInterval(timerInterval);
            intBox.innerHTML = '';
            fBox.style.display = 'none';
            
            qEl.innerText = "⏳ 타임업! 점수를 정산하는 중입니다...";
            if (!SCRIPT_URL || SCRIPT_URL.includes('여기에_구글_웹앱')) {
                showFinalResult();
            } else {
                updateLiveScore(true);
            }
        }

        function calculateGrade(finalScore) {
            if (finalScore >= 20000) return "....뭐하는 사람이세요 (역사 마스터)";
            if (finalScore >= 17500) return "이건 무조건 핵이다 (초천재)";
            if (finalScore >= 15000) return "...?어케하셨어요";
            if (finalScore >= 10000) return "신 그자체";
            if (finalScore >= 6000) return "👑 챌린저 👑";
            if (finalScore >= 3000) return "👑 신화";
            if (finalScore >= 2000) return "🥇 다이아";
            if (finalScore >= 1200) return "🥈 플래티넘";
            if (finalScore >= 600)  return "🥉 골드";
            return "🌱 브론즈 (새싹)";
        }

        function showFinalResult() {
            leaderboardData.sort((a, b) => b.score - a.score);
            const myRank = leaderboardData.findIndex(p => p.name === playerName && p.score === score) + 1;
            
            let rankText = (myRank > 0 && myRank <= 1000) ? `${myRank}위` : "오프라인 모드";
            let gradeText = calculateGrade(score);

            qEl.innerHTML = `
                🏁 타임어택 종료! 🏁<br><br>
                도전자: <span style="color:#00f2fe">${playerName}</span><br>
                최종 점수: <span style="color:#ff007f">${score}점</span><br>
                획득 등급: <span style="color:#ffd700">${gradeText}</span><br>
                실시간 순위: <span style="color:#00f2fe">${rankText}</span>
            `;

            actBtn.innerText = "새로운 게임 도전하기 🔄";
            actBtn.style.display = 'block';
            actBtn.focus();
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && actBtn.style.display === 'block') {
                handleActionClick();
            }
        });

        loadLeaderboard();
        setInterval(loadLeaderboard, 5000);
        askPlayerName();
    </script>
</body>
</html>
