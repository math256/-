<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국사 퀴즈</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Noto Sans KR', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
            color: #ffffff;
        }

        /* 메인 래퍼: 퀴즈창과 미니 순위표를 가로로 배치 */
        .main-wrapper {
            display: flex;
            gap: 25px;
            width: 100%;
            max-width: 1050px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            flex: 1 1 550px;
            max-width: 620px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        /* 퀴즈 사이트 내부 미니 순위표 스타일 */
        .mini-leaderboard {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 25px;
            flex: 1 1 280px;
            max-width: 340px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            height: fit-content;
        }

        .leaderboard-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
        }

        .leaderboard-item.current-player {
            background: rgba(0, 242, 254, 0.15);
            border-color: #00f2fe;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
            font-weight: 700;
        }

        .rank-badge {
            font-weight: 700;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
        }

        .rank-1 .rank-badge { background: #ffd700; color: #15102a; }
        .rank-2 .rank-badge { background: #c0c0c0; color: #15102a; }
        .rank-3 .rank-badge { background: #cd7f32; color: #15102a; }

        .player-name { flex-grow: 1; margin-left: 12px; }
        .player-score { font-weight: 700; color: #00f2fe; }

        /* 기존 게임 UI 스타일 유지 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .stats { font-size: 1rem; font-weight: bold; color: #ff007f; }

        .question-box {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 30px;
            text-align: center;
            min-height: 80px;
            animation: fadeIn 0.6s ease-out;
        }

        .choices-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }

        .choice-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #eeeeee;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 25px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s ease;
        }

        .choice-btn:hover {
            background: rgba(0, 242, 254, 0.1);
            border-color: #00f2fe;
            color: #00f2fe;
            transform: translateY(-2px);
        }

        .input-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }

        .answer-input {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 18px;
            font-size: 1.1rem;
            border-radius: 14px;
            color: #fff;
            outline: none;
            text-align: center;
            transition: all 0.3s ease;
        }

        .answer-input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .submit-btn {
            background: #00f2fe;
            color: #15102a;
            border: none;
            padding: 15px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover { background: #00b09b; color: #fff; }
        .choice-btn.correct { background: linear-gradient(90deg, #00b09b, #96c93d) !important; color: #fff !important; }
        .choice-btn.wrong { background: linear-gradient(90deg, #ff416c, #ff4b2b) !important; color: #fff !important; }

        .feedback-box {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            text-align: center;
            margin-bottom: 25px;
            display: none;
            white-space: pre-line;
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            display: none;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.1) 0%, rgba(79, 172, 254, 0.1) 100%);
            z-index: 1;
            filter: blur(1px);
        }
        .circle1 { width: 300px; height: 300px; top: -10%; left: -10%; }
        .circle2 { width: 400px; height: 400px; bottom: -15%; right: -10%; background: linear-gradient(135deg, rgba(255, 0, 127, 0.08) 0%, rgba(255, 75, 43, 0.08) 100%); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

    <div class="main-wrapper">
        <div class="game-container">
            <div class="header">
                <div class="title" id="quiz-title">🇰🇷 한국사 능력 챌린지</div>
                <div class="stats" id="score-board">SCORE: 000 | COMBO: 0</div>
            </div>
            <div class="question-box" id="question">이름 등록 단계</div>
            <div id="interaction-box"></div>
            <div class="feedback-box" id="feedback"></div>
            <button class="action-btn" id="action-btn" onclick="handleActionClick()">다음 문제로 전진 ➡️</button>
        </div>

        <div class="mini-leaderboard">
            <div class="leaderboard-title">🏆 실시간 랭킹 Top 5</div>
            <div class="leaderboard-list" id="leaderboard-list"></div>
        </div>
    </div>

    <script>
        // ⚠️여기에 본인의 구글 Apps Script 웹 앱 URL을 붙여넣으세요!
        const SCRIPT_URL = '여기에_구글_웹앱_URL을_붙여넣으세요';

        const quizList = [
            {"type": "short", "q": "Q. 청동기 시대를 대표하는 무덤 양식으로, 큰 돌을 받쳐 세우거나 땅에 묻어 만든 선사 시대의 무덤은 무엇일까요?", "a": "고인돌", "e": "🎯 고인돌은 청동기 시대의 대표적인 무덤이야."},
            {"type": "short", "q": "Q. 단군왕검이 세운 우리나라 역사상 최초의 국가 이름은 무엇일까요?", "a": "고조선", "e": "🎯 고조선은 역사상 최초의 국가야."},
            {"type": "short", "q": "Q. 삼국 시대 중 가장 먼저 한강 유역을 차지하며 전성기를 맞이한 나라는 어디일까요?", "a": "백제", "e": "🎯 백제는 4세기 근초고왕 때 한강 유역을 차지했어."},
            {"type": "short", "q": "Q. 삼국을 통일한 신라가 당나라의 군대를 최종적으로 격파하며 삼국 통일을 완성한 해는 몇 년일까요? (숫자만 입력)", "a": "676", "e": "🎯 신라는 676년에 삼국 통일을 완수했어."},
            {"type": "short", "q": "Q. 고려 시대에 벽란도를 통해 전 세계에 이름을 알린 이 나라의 이름은 무엇일까요?", "a": "고려", "e": "🎯 고려는 '코리아(Korea)'의 유래가 되었어."},
            {"type": "short", "q": "Q. 조선 시대에 세종 대왕이 창제한 우리나라의 고유 문자는 무엇일까요?", "a": "훈민정음", "e": "🎯 세종 대왕은 1443년에 훈민정음을 창제하셨어."},
            {"type": "short", "q": "Q. 임진왜란 때 한산도 대첩, 명량 대첩 등에서 활약한 조선의 장군은 누구일까요?", "a": "이순신", "e": "🎯 이순신 장군은 거북선 등을 활용하여 큰 승리를 거두셨어."},
            {"type": "short", "q": "Q. 일제 강점기인 1919년, 온 국민이 만세를 부르며 일제에 저항한 최대 규모의 민족 운동은 무엇일까요?", "a": "3.1운동", "e": "🎯 3·1 운동은 최대 규모의 항일 독립운동이야."},
            {"type": "short", "q": "Q. 광복 이후 한반도가 38도선을 경계로 나누어지게 된 현상을 무엇이라 할까요?", "a": "국토분단", "e": "🎯 남북의 정치적 갈등으로 국토가 분단되었어."},
            {"type": "short", "q": "Q. 1960년 독재 정권과 부정 선거에 맞서 민주주의를 지켜낸 대한민국 최초의 성공한 민주화 운동은 무엇일까요?", "a": "4.19혁명", "e": "🎯 4·19 혁명은 독재 정권을 무너뜨린 민주주의 혁명이야."},
            {"type": "choice", "q": "Q. 구석기 시대 사람들의 생활 모습으로 올바른 것은 무엇일까요?", "c": ["① 돌을 갈아서 만든 간석기를 사용했다.", "② 정착 생활을 하며 움집을 짓고 살았다.", "③ 주로 동굴이나 바위 그늘에 살며 이동 생활을 했다.", "④ 벼농사를 대규모로 지었다."], "a": 2, "e": "🎯 구석기인은 동굴이나 막집에서 이동 생활을 했어."},
            {"type": "choice", "q": "Q. 신석기 시대에 진흙으로 구워 만든 대표적인 토기는 무엇일까요?", "c": ["① 빗살무늬 토기", "② 미송리식 토기", "③ 민무늬 토기", "④ 청자"], "a": 0, "e": "🎯 빗살무늬 토기는 신석기 시대를 대표해."},
            {"type": "choice", "q": "Q. 고조선의 사회 모습을 알 수 있는 법은 무엇일까요?", "c": ["① 헌법", "② 8조법", "③ 경국대전", "④ 홍범 14조"], "a": 1, "e": "🎯 고조선에는 사회 유지를 위한 8조법이 있었어."},
            {"type": "choice", "q": "Q. 고구려의 전성기를 이끈 왕으로 적극적인 남진 정책을 펼친 왕은 누구일까요?", "c": ["① 동명성왕", "② 근초고왕", "③ 관계토대왕", "④ 장수왕"], "a": 3, "e": "🎯 장수왕은 평양으로 천도하고 남진 정책을 펼쳤어."},
            {"type": "choice", "q": "Q. 신라의 청소년 수양 단체로 인재를 배출한 조직은 무엇일까요?", "c": ["① 화랑도", "② 6두품", "③ 집사부", "④ 서당"], "a": 0, "e": "🎯 화랑도는 신라 삼국 통일의 밑거름이 되었어."},
            {"type": "choice", "q": "Q. 대조영이 고구려 유민들과 말갈족을 이끌고 세운 국가의 이름은 무엇일까요?", "c": ["① 고려", "② 발해", "③ 백제", "④ 후고구려"], "a": 1, "e": "🎯 발해는 고구려의 영토와 문화를 계승했어."},
            {"type": "choice", "q": "Q. 고려를 세우고 후삼국을 통일한 왕은 누구일까요?", "c": ["① 광종", "② 공민왕", "③ 왕건", "④ 견훤"], "a": 2, "e": "🎯 태조 왕건은 고려를 건국하고 후삼국을 통일했어."},
            {"type": "choice", "q": "Q. 고려 시대에 몽골의 침략을 물리치기 위해 만든 세계 기록 유산은 무엇일까요?", "c": ["① 직지심체요절", "② 팔만대장경", "③ 무구정광대다라니경", "④ 조선왕조실록"], "a": 1, "e": "🎯 팔만대장경은 불교의 힘으로 국난을 극복하고자 만들었어."},
            {"type": "choice", "q": "Q. 흙으로 모양을 빚은 후 표면에 무늬를 파내고 다른 흙을 채워 구워낸 고려의 도자기는 무엇일까요?", "c": ["① 상감 청자", "② 백자 달항아리", "③ 분청사기", "④ 옹기"], "a": 0, "e": "🎯 고려 상감 청자는 독창적인 상감 기법이 특징이야."},
            {"type": "choice", "q": "Q. 조선을 건국한 인물과 국가의 기본 이념이 바르게 짝지어진 것은 무엇일까요?", "c": ["① 왕건 - 불교", "② 이성계 - 유교(성리학)", "③ 이성계 - 불교", "④ 대조영 - 유교"], "a": 1, "e": "🎯 태조 이성계는 성리학을 근본으로 조선을 세웠어."},
            {"type": "choice", "q": "Q. 오늘날 대한민국의 수도인 서울의 옛 이름은 무엇일까요?", "c": ["① 한양", "② 개경", "③ 경주", "④ 부여"], "a": 0, "e": "🎯 조선은 교통이 편리한 한양으로 도읍을 정했어."},
            {"type": "choice", "q": "Q. 조선 후기 영조와 정조 시기에 실제 생활에 유용한 지식을 연구한 학문은 무엇일까요?", "c": ["① 성리학", "② 불교 학문", "③ 실학", "④ 신학"], "a": 2, "e": "🎯 실학은 사회 문제를 해결하려 했던 학문이야."},
            {"type": "choice", "q": "Q. 정조 대왕이 거중기 등을 활용하여 축조한 과학적인 성곽 건축물은 무엇일까요?", "c": ["① 남한산성", "② 수원 화성", "③ 한양도성", "④ 북한산성"], "a": 1, "e": "🎯 수원 화성은 과학적이고 실용적인 성곽이야."},
            {"type": "choice", "q": "Q. 조선 후기 서민 문화의 발달 모습으로 가장 거리가 먼 것은 무엇일까요?", "c": ["① 한글 소설과 사설시조가 유행했다.", "② 양반들의 귀족적 생활을 찬양하는 시가 유행했다.", "③ 판소리와 탈춤이 시장과 마당에서 공연되었다.", "④ 민화가 널리 그려져 집안을 장식했다."], "a": 1, "e": "🎯 서민 문화는 양반의 위선을 풍자하는 방향으로 발달했어."},
            {"type": "choice", "q": "Q. 1876년 조선이 일본과 맺은 최초의 근대적 조약이자 불평등 조약은 무엇일까요?", "c": ["① 강화도 조약", "② 한일 병합 조약", "③ 을사늑약", "④ 조미 수호 통상 조약"], "a": 0, "e": "🎯 강화도 조약은 최초의 근대적 조약이야."},
            {"type": "choice", "q": "Q. 1905년 일제가 대한제국의 외교권을 강탈하기 위해 강제로 체결한 조약은 무엇일까요?", "c": ["① 강화도 조약", "② 을사늑약", "③ 한일 의정서", "④ 정미 7조약"], "a": 1, "e": "🎯 일제는 을사늑약을 강제로 체결해 외교권을 빼앗았어."},
            {"type": "choice", "q": "Q. 3·1 운동의 결과로 독립운동을 조직적으로 이끌기 위해 상하이에 세워진 단체는 무엇일까요?", "c": ["① 신간회", "② 독립협회", "③ 대한민국 임시 정부", "④ 의열단"], "a": 2, "e": "🎯 민족의 구심점으로 대한민국 임시 정부가 수립되었어."},
            {"type": "choice", "q": "Q. 1950년 북한군의 기습 남침으로 시작되어 현재까지 휴전 중인 전쟁은 무엇일까요?", "c": ["① 러일 전쟁", "② 청일 전쟁", "③ 베트남 전쟁", "④ 6·25 전쟁"], "a": 3, "e": "🎯 6·25 전쟁의 분단 상태는 현재까지 지속되고 있어."},
            {"type": "choice", "q": "Q. 1987년 6월, 시민들이 대통령 직선제를 쟁취해 낸 민주화 운동은 무엇일까요?", "c": ["① 4·19 혁명", "② 5·18 민주화 운동", "③ 6월 민주 항쟁", "④ 3·15 의거"], "a": 2, "e": "🎯 6월 민주 항쟁으로 6·29 선언이 발표되었어."},
            {"type": "choice", "q": "Q. 1970년대 이후 대한민국의 급격한 경제 성장을 일컫는 표현은 무엇일까요?", "c": ["① 한강의 기적", "② 새마을 운동", "③ 경제 개발 5개년 계획", "④ 라인강의 기적"], "a": 0, "e": "🎯 폐허 속에서 빠르게 이뤄낸 성장을 '한강의 기적'이라 불러."}
        ];

        let currentIdx = 0;
        let score = 0;
        let combo = 0;
        let isAnswered = false;
        let playerName = "플레이어";
        let leaderboardData = [];

        const qEl = document.getElementById('question');
        const intBox = document.getElementById('interaction-box');
        const fBox = document.getElementById('feedback');
        const actBtn = document.getElementById('action-btn');
        const scoreEl = document.getElementById('score-board');
        const rankListEl = document.getElementById('leaderboard-list');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 구글 시트에서 전체 랭킹 실시간으로 로드
        function loadLeaderboard() {
            if (!SCRIPT_URL || SCRIPT_URL.includes('여기에_구글_웹앱')) return;

            fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                leaderboardData = data;
                renderLeaderboard();
            })
            .catch(err => console.error("랭킹 로드 실패:", err));
        }

        function renderLeaderboard() {
            rankListEl.innerHTML = '';
            // 높은 점수 순으로 정렬
            leaderboardData.sort((a, b) => b.score - a.score);

            // 미니 순위표에는 상위 5명만 노출
            leaderboardData.slice(0, 5).forEach((player, idx) => {
                const item = document.createElement('div');
                item.classList.add('leaderboard-item', `rank-${idx + 1}`);
                if (player.name === playerName) item.classList.add('current-player');

                item.innerHTML = `
                    <div class="rank-badge">${idx + 1}</div>
                    <div class="player-name">${player.name}</div>
                    <div class="player-score">${player.score}점</div>
                `;
                rankListEl.appendChild(item);
            });
        }

        // 구글 시트로 점수 전송 (POST 요청)
        function updateLiveScore() {
            if (!SCRIPT_URL || SCRIPT_URL.includes('여기에_구글_웹앱')) return;

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ name: playerName, score: score })
            })
            .then(() => loadLeaderboard()) // 점수 반영 후 랭킹 새로고침
            .catch(err => console.error("점수 전송 실패:", err));
        }

        function askPlayerName() {
            isAnswered = false;
            fBox.style.display = 'none';
            actBtn.style.display = 'none';
            intBox.innerHTML = '';
            
            qEl.innerText = "챌린지에 참여할 이름을 등록해 주세요!";

            const inputContainer = document.createElement('div');
            inputContainer.classList.add('input-container');

            const input = document.createElement('input');
            input.type = "text";
            input.classList.add('answer-input');
            input.placeholder = "닉네임을 입력하세요 (최대 6자)";
            input.id = "name-input";
            input.maxLength = 6;
            input.onkeypress = (e) => { if(e.key === 'Enter') startGameWithPlayer(); };

            const submitBtn = document.createElement('button');
            submitBtn.classList.add('submit-btn');
            submitBtn.innerText = "등록하고 시작하기 🚀";
            submitBtn.onclick = startGameWithPlayer;

            inputContainer.appendChild(input);
            inputContainer.appendChild(submitBtn);
            intBox.appendChild(inputContainer);
            input.focus();
        }

        function startGameWithPlayer() {
            const nameInput = document.getElementById('name-input');
            const val = nameInput.value.trim();
            if(!val) return;

            playerName = val;
            initGame();
        }

        function initGame() {
            currentIdx = 0;
            score = 0;
            combo = 0;
            shuffleArray(quizList); 
            updateScoreBoard();
            updateLiveScore(); // 0점 상태로 구글 시트에 유저 생성 및 갱신
            loadQuiz();
        }

        function loadQuiz() {
            isAnswered = false;
            fBox.style.display = 'none';
            actBtn.style.display = 'none';
            intBox.innerHTML = '';

            if(currentIdx < quizList.length) {
                const currentQuiz = quizList[currentIdx];
                qEl.innerText = `${currentIdx + 1}. ${currentQuiz.q.replace('Q. ', '')}`;

                if (currentQuiz.type === "choice") {
                    const choicesContainer = document.createElement('div');
                    choicesContainer.classList.add('choices-container');
                    currentQuiz.c.forEach((choice, index) => {
                        const button = document.createElement('button');
                        button.classList.add('choice-btn');
                        button.innerText = choice;
                        button.onclick = () => checkChoiceAnswer(index, button);
                        choicesContainer.appendChild(button);
                    });
                    intBox.appendChild(choicesContainer);
                    document.activeElement.blur();
                } else if (currentQuiz.type === "short") {
                    const inputContainer = document.createElement('div');
                    inputContainer.classList.add('input-container');

                    const input = document.createElement('input');
                    input.type = "text";
                    input.classList.add('answer-input');
                    input.placeholder = "정답을 입력하세요";
                    input.id = "user-input";
                    input.onkeypress = (e) => { if(e.key === 'Enter' && !isAnswered) checkShortAnswer(); };

                    const submitBtn = document.createElement('button');
                    submitBtn.classList.add('submit-btn');
                    submitBtn.innerText = "정답 검사하기 ✔️";
                    submitBtn.onclick = checkShortAnswer;

                    inputContainer.appendChild(input);
                    inputContainer.appendChild(submitBtn);
                    intBox.appendChild(inputContainer);
                    input.focus();
                }
            } else {
                qEl.innerHTML = `🎉 대한민국 역사 마스터 완료! 🎉<br><br>[${playerName}]님의 최종 점수: <span style="color:#00f2fe">${score}점</span>`;
                actBtn.innerText = "새로운 이름으로 다시 도전하기 🔄";
                actBtn.style.display = 'block';
                actBtn.focus();
                updateLiveScore(); // 모든 문제가 끝난 후 최종 점수 확실하게 동기화
            }
        }

        function checkChoiceAnswer(selectedIdx, clickedBtn) {
            if(isAnswered) return;
            isAnswered = true;
            const currentQuiz = quizList[currentIdx];
            const allButtons = intBox.querySelectorAll('.choice-btn');

            if(selectedIdx === currentQuiz.a) {
                combo++;
                score += 100 + (combo * 10);
                clickedBtn.classList.add('correct');
                showFeedback(true, currentQuiz.e);
            } else {
                combo = 0;
                clickedBtn.classList.add('wrong');
                allButtons[currentQuiz.a].classList.add('correct');
                showFeedback(false, currentQuiz.e);
            }
            updateLiveScore();
            showNextControls();
        }

        function checkShortAnswer() {
            if(isAnswered) return;
            const inputEl = document.getElementById('user-input');
            const userAnswer = inputEl.value.trim();
            if(!userAnswer) return;

            isAnswered = true;
            inputEl.disabled = true;
            intBox.querySelector('.submit-btn').style.display = 'none';
            const currentQuiz = quizList[currentIdx];

            if(userAnswer === currentQuiz.a) {
                combo++;
                score += 100 + (combo * 10);
                inputEl.style.background = 'rgba(0, 176, 155, 0.2)';
                inputEl.style.borderColor = '#00b09b';
                showFeedback(true, currentQuiz.e);
            } else {
                combo = 0;
                inputEl.style.background = 'rgba(255, 65, 108, 0.2)';
                inputEl.style.borderColor = '#ff416c';
                showFeedback(false, `제출한 정답: ${userAnswer}\n\n정답은 [ ${currentQuiz.a} ] 입니다!\n\n${currentQuiz.e}`);
            }
            updateLiveScore();
            showNextControls();
        }

        function showFeedback(isCorrect, text) {
            fBox.style.color = isCorrect ? '#00ff7f' : '#ff416c';
            fBox.innerText = isCorrect ? "⭕ 정답입니다!\n\n" + text : "❌ 오답입니다!\n\n" + text;
            fBox.style.display = 'block';
            updateScoreBoard();
        }

        function showNextControls() {
            actBtn.innerText = "다음 문제로 전진 ➡️";
            actBtn.style.display = 'block';
        }

        function handleActionClick() {
            if(currentIdx < quizList.length) {
                currentIdx++;
                loadQuiz();
            } else {
                askPlayerName();
            }
        }

        function updateScoreBoard() {
            scoreEl.innerText = `SCORE: ${String(score).padStart(3, '0')} | COMBO: ${combo}`;
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && actBtn.style.display === 'block') {
                handleActionClick();
            }
        });

        // 초기에 랭킹 한번 당겨오고, 이후 5초마다 실시간 갱신(주기적인 폴링)
        loadLeaderboard();
        setInterval(loadLeaderboard, 5000);
        
        askPlayerName();
    </script>
</body>
</html>
